<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6847"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Canto"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Cantonese Carry-On</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a phone-first study kit styled after HK transit signage — jade boards, minibus-red signals, tone-coloured Jyutping. Sticky header, fixed bottom tab bar, one column that widens to two on desktop. */
:root{
  --bg:#ecf1ed; --surface:#f9fbf9; --sunk:#e1eae4; --ink:#0f241b; --muted:#4c6056; --line:#c7d5cc;
  --jade:#0b6847; --jade-ink:#f4fbf7; --signal:#c4352a; --signal-soft:#f6dcd6; --focus:#1d5bb8;
  --t1:#c22a2a; --t2:#b05c00; --t3:#2a7a36; --t4:#1d5ab5; --t5:#8136ad; --t6:#66603d;
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-zh:"PingFang HK","Noto Sans HK","Noto Sans CJK HK","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1511; --surface:#13201a; --sunk:#0f1a15; --ink:#e5efe9; --muted:#97aba0; --line:#26392f;
  --jade:#4cc497; --jade-ink:#06140e; --signal:#ff6b57; --signal-soft:#3a1d18; --focus:#7fb0ff;
  --t1:#ff7b72; --t2:#ffae4d; --t3:#72d27d; --t4:#82b2ff; --t5:#d39bff; --t6:#cdc799; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#13201a; --sunk:#0f1a15; --ink:#e5efe9; --muted:#97aba0; --line:#26392f;
  --jade:#4cc497; --jade-ink:#06140e; --signal:#ff6b57; --signal-soft:#3a1d18; --focus:#7fb0ff;
  --t1:#ff7b72; --t2:#ffae4d; --t3:#72d27d; --t4:#82b2ff; --t5:#d39bff; --t6:#cdc799; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--jade)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.zh,[lang="zh-HK"]{font-family:var(--f-zh)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--jade);color:var(--jade-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 1.15rem/1 var(--f-disp);font-stretch:80%;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.brand span{font:500 .95rem/1 var(--f-zh);opacity:.85}
.back{border:0;background:transparent;color:inherit;font:700 .95rem var(--f-disp);font-stretch:85%;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 8px 0;cursor:pointer;display:flex;align-items:center;gap:6px}
.top-title{font:800 1.05rem/1.1 var(--f-disp);font-stretch:85%;text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .row{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);position:relative}
.tab i{font:600 1.35rem/1.1 var(--f-zh);font-style:normal}
.tab small{font:700 .7rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.06em}
.tab[aria-current="page"]{color:var(--jade)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--jade);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--signal);color:#fff;font:700 .7rem/18px var(--f-body);text-align:center}

/* type */
h1{font:850 clamp(1.7rem,6vw,2.4rem)/1.05 var(--f-disp);font-stretch:78%;text-transform:uppercase;letter-spacing:.005em;margin:0;text-wrap:balance}
h1 .zh{display:block;font:600 1.1rem/1.4 var(--f-zh);text-transform:none;color:var(--jade);letter-spacing:.1em;margin-top:4px}
h2{font:800 1.05rem/1.2 var(--f-disp);font-stretch:85%;text-transform:uppercase;letter-spacing:.05em;margin:28px 0 12px;color:var(--muted)}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.eyebrow{font:700 .72rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.12em;color:var(--signal);margin:0 0 8px}

/* tone legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;font-size:.85rem}
.legend svg{width:26px;height:18px;flex:none}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}.t6{color:var(--t6)}
.tn{font-size:.72em;vertical-align:.35em;margin-left:1px;font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin-top:8px}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--jade)}
.tile-zh{grid-row:span 3;writing-mode:vertical-rl;font:700 1.25rem/1 var(--f-zh);background:var(--jade);color:var(--jade-ink);padding:10px 7px;border-radius:6px;letter-spacing:.12em;min-height:88px;text-align:center}
.tile-en{font:800 1.08rem/1.15 var(--f-disp);font-stretch:85%;text-transform:uppercase;letter-spacing:.02em}
.tile-blurb{color:var(--muted);font-size:.9rem;line-height:1.35}
.tile-meta{font:700 .72rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--signal);margin-top:4px}

/* intro */
.intro{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;max-width:70ch}
.intro li{position:relative;padding-left:20px}
.intro li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;background:var(--signal);border-radius:2px;transform:rotate(45deg)}
.intro strong{font-weight:700}

/* toolbar & chips */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.chip.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{background:var(--signal);color:#fff;border-color:var(--signal)}

/* items */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;margin-top:14px;align-items:start}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.item-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.say{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit}
.word{font:700 2rem/1.1 var(--f-zh);letter-spacing:.04em}
.jp{font:600 1.05rem/1.3 var(--f-body);letter-spacing:.01em}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--jade);color:var(--jade-ink);display:grid;place-items:center;cursor:pointer}
.play svg{width:16px;height:16px;margin-left:2px}
.play.sm{width:32px;height:32px}.play.sm svg{width:13px;height:13px}
.play.on{background:var(--signal)}
.mean{display:grid;gap:2px}
.en{font-weight:700;font-size:1.05rem}
.fr{color:var(--muted);font-size:.95rem}
.fr::before{content:"FR";font:700 .62rem/1 var(--f-disp);letter-spacing:.08em;border:1px solid currentColor;border-radius:3px;padding:1px 3px;margin-right:6px;vertical-align:.15em}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:0;font-size:.93rem}
.facts dt{font:700 .7rem/1.9 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:0;min-width:0}
.ex{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.ex .play{grid-row:span 4}
.ex-zh{font:600 1.15rem/1.4 var(--f-zh);cursor:pointer}
.ex-jp{font-size:.9rem}
.ex-en{font-size:.92rem}
.ex-fr{font-size:.88rem;color:var(--muted)}
.item-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.anki{border:1.5px dashed var(--jade);color:var(--jade);background:transparent;border-radius:999px;padding:6px 12px;font:700 .8rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.anki[aria-pressed="true"]{border-style:solid;background:var(--jade);color:var(--jade-ink)}
.ref{font-size:.85rem;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--jade);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
.veil{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
@media (prefers-reduced-motion:reduce){.veil{transition:none}}

/* tone ladder */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:14px}
.rung{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;cursor:pointer;text-align:left}
.rung .word{font-size:1.8rem}
.rung svg{width:100%;height:34px}
.rung p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.35}

/* pronunciation table / numbers */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .7rem/1.4 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td code{font:700 1rem var(--f-body);color:var(--jade)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.num b{font:700 1.6rem/1.1 var(--f-zh)}
.num span{font-size:.85rem}
.num small{font-variant-numeric:tabular-nums;color:var(--muted)}
.numnotes{font-size:.88rem;color:var(--muted);margin:8px 0 0}
@media (max-width:420px){.nums{grid-template-columns:repeat(5,1fr);gap:6px}.num b{font-size:1.3rem}}

/* readings */
.lines{display:grid;gap:12px;margin-top:14px;max-width:760px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 10px}
.line.now{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal-soft)}
.sp{grid-column:1/-1;font:700 .7rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.1em;color:var(--signal)}
.toks{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-end;min-width:0}
.tk{border:0;background:none;padding:2px 2px 0;display:inline-grid;justify-items:center;cursor:pointer;border-radius:4px}
.tk:hover{background:var(--sunk)}
.tk b{font:600 1.45rem/1.25 var(--f-zh)}
.tk i{font:600 .78rem/1.2 var(--f-body);font-style:normal;white-space:nowrap}
.tk .pu{font-weight:400;margin-left:1px}
.hidejp .tk i{display:none}
.tr{grid-column:1/-1;display:grid;gap:2px;font-size:.95rem}
.tr .lfr{color:var(--muted);font-size:.9rem}
.note{margin-top:16px;max-width:760px;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.93rem}
.note b{font:700 .72rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.1em;color:var(--signal);display:block;margin-bottom:6px}
.gloss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gloss button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;display:grid;gap:1px}
.gloss .zh{font-size:1.1rem;font-weight:600}
.gloss small{font-size:.78rem;color:var(--muted)}
.lvl{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--signal)}

/* popover */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .35);display:flex;align-items:flex-end;justify-content:center}
.pop{width:min(560px,100%);background:var(--surface);border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:10px;box-shadow:0 -10px 30px rgb(0 0 0 / .2)}
.pop-head{display:flex;align-items:center;gap:12px}
.pop .word{font-size:2.4rem}
.x{margin-left:auto;border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.2rem;line-height:1}

/* anki */
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;max-width:68ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:6px;background:var(--jade);color:var(--jade-ink);font:800 .95rem/28px var(--f-disp);text-align:center}
.batch{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.batch-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--sunk)}
.batch-head h3{margin:0;font:800 1rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.05em}
.batch-head .acts{display:flex;flex-wrap:wrap;gap:6px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.card .zh{font-size:1.35rem;font-weight:700;grid-row:span 2}
.card .m{font-size:.92rem}
.card .s{font-size:.82rem;color:var(--muted);grid-column:2;min-width:0;overflow-wrap:anywhere}
.rm{grid-row:span 2;border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:36px;height:36px;border-radius:50%}
.rm:hover{background:var(--sunk);color:var(--signal)}
.empty{margin-top:18px;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
textarea{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}

/* voice */
.status{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:var(--r);margin-top:16px;border:1px solid var(--line);background:var(--surface)}
.status .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.ok .dot{background:var(--t3)} .bad .dot{background:var(--signal)}
.status p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.howto{display:grid;gap:10px;margin-top:10px;max-width:70ch}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.howto b{font:800 .85rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.howto p{margin:0;font-size:.93rem}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--signal-soft);border:1px solid var(--signal);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.92rem}

/* listening mode */
.setrow{display:grid;gap:6px;margin-top:14px}
.setrow>span,.setrow>label{font:700 .72rem/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.setrow .toolbar{margin:0}
.setrow select{width:100%;max-width:520px}
.np{margin-top:18px;max-width:640px;background:var(--jade);color:var(--jade-ink);border-radius:14px;padding:18px 18px 14px;display:grid;gap:8px;min-height:190px;align-content:start}
.np-meta{display:flex;justify-content:space-between;gap:12px;font:700 .72rem/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-variant-numeric:tabular-nums}
.np-tr{font-size:1.05rem;font-weight:700;transition:opacity .2s}
.np-zh{font:700 clamp(1.6rem,7vw,2.2rem)/1.3 var(--f-zh);transition:opacity .2s}
.np-jp{font-size:.95rem;opacity:.9}
.np-jp [class^="t"]{color:inherit}
.np-fr{font-size:.92rem;opacity:.8}
.np[data-phase="tr"] .np-zh,.np[data-phase="tr"] .np-jp{opacity:.35}
.np[data-phase="zh"] .np-tr{opacity:.55}
.np-rep{font:700 .72rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.1em;min-height:1em}
.np-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--jade-ink) 25%,transparent);overflow:hidden}
.np-bar i{display:block;height:100%;width:0;background:var(--jade-ink)}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:16px;max-width:640px}
.ctl{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ctl svg{width:18px;height:18px}
.ctl.big{width:76px;height:76px;border:0;background:var(--signal);color:#fff}
.ctl.big svg{width:26px;height:26px}
@media (prefers-reduced-motion:reduce){.np-tr,.np-zh{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
</style>

<div class="top"><div class="wrap" id="top"></div></div>
<main><div class="wrap" id="main"></div></main>
<nav class="tabs" aria-label="Sections"><div class="row" id="tabs"></div></nav>

ectful way to address her mum. Warm but polite.","mn":"French: baak-mou ≈ « belle-maman »… one day, maybe.","tip":"baak3 is clipped (-k), mou5 rises from low.","wt":["伯母"],"zh":"伯母","jp":"baak3 mou5","et":["伯母","好","！"],"ezh":"伯母好！","ejp":"baak3 mou5 hou2!","anki":true,"notes":"<b>Gloss:<\/b> 伯母 — baak3 mou5 — madame (mère d'un ami) · 好 — hou2 — bon<br><b>Literally:<\/b> elder-uncle's mother<br><b>Pronunciation:<\/b> baak3 is clipped (-k), mou5 rises from low.<br><b>Usage:<\/b> The respectful way to address her mum. Warm but polite.","nw":39},{"w":"世伯","en":"Uncle (a friend's or partner's dad)","fr":"monsieur (père d'un ami / de sa copine)","ex":"世伯 ， 你好 ！","ex_en":"Hello, Uncle!","ex_fr":"Bonjour, monsieur !","lit":"generation uncle","why":"The respectful way to address her dad.","mn":"« Sigh, back! »: her dad sighs as she brings a Frenchman back home.","wt":["世伯"],"zh":"世伯","jp":"sai3 baak3","et":["世伯","，","你好","！"],"ezh":"世伯，你好！","ejp":"sai3 baak3, nei5 hou2!","anki":true,"notes":"<b>Gloss:<\/b> 世伯 — sai3 baak3 — monsieur (père d'un ami) · 你好 — nei5 hou2 — bonjour<br><b>Literally:<\/b> generation uncle<br><b>Usage:<\/b> The respectful way to address her dad.","nw":28},{"w":"屋企人","en":"family","fr":"la famille","ex":"我 想 見 你 屋企人 。","ex_en":"I'd like to meet your family.","ex_fr":"J'aimerais rencontrer ta famille.","lit":"home people","gram":"Close relations drop 嘅: 你屋企人, 我女朋友 (not 你嘅屋企人).","mn":"屋企 uk-kei = home; add 人 jan (people).","wt":["屋企人"],"zh":"屋企人","jp":"uk1 kei2 jan4","et":["我","想","見","你","屋企人","。"],"ezh":"我想見你屋企人。","ejp":"ngo5 soeng2 gin3 nei5 uk1 kei2 jan4.","anki":true,"notes":"<b>Gloss:<\/b> 我 — ngo5 — je · 想 — soeng2 — vouloir · 見 — gin3 — voir · 你 — nei5 — tu · 屋企人 — uk1 kei2 jan4 — la famille<br><b>Literally:<\/b> home people<br><b>Grammar:<\/b> Close relations drop 嘅: 你屋企人, 我女朋友 (not 你嘅屋企人).","nw":45},{"w":"爸爸","en":"dad","fr":"papa","ex":"佢 爸爸 好 高 。","ex_en":"Her dad is very tall.","ex_fr":"Son père est très grand.","tip":"baa4 low falling, baa :55}],"extra":null},{"id":"blocks","title":"Building blocks","zh":"基本","blurb":"Pronouns and the five little words that hold every sentence together","intro":["Verbs **never change**: 我去, 你去, 佢去. No conjugation, no tense endings.","Plural = add **哋 dei6**: 我 → 我哋 (we), 你 → 你哋, 佢 → 佢哋.","**佢** is he, she *and* it. Context decides.","Word order is like English and French: **Subject + Verb + Object**."],"items":[{"w":"我","en":"I, me","fr":"je, moi","ex":"我 係 法國人 。","ex_en":"I'm French.","ex_fr":"Je suis français.","tip":"Starts with ng-. Many young people say « o5 » without the ng; both are fine.","mn":"« Ngo » ≈ « ego »: me, me, me.","wt":["我"],"zh":"我","jp":"ngo5","et":["我","係","法國人","。"],"ezh":"我係法國人。","ejp":"ngo5 hai6 faat3 gwok3 jan4.","anki":true,"notes":"<b>Gloss:<\/b> 我 — ngo5 — je · 係 — hai6 — être · 法國人 — faat3 gwok3 jan4 — Français(e)<br><b>Pronunciation:<\/b> Starts with ng-. Many young people say « o5 » without the ng; both are fine.","nw":37},{"w":"佢","en":"he, she, it","fr":"il, elle","ex":"佢 係 我 女朋友 。","ex_en":"She's my girlfriend.","ex_fr":"C'est ma copine.","tip":"keoi5: « eoi » ≈ French « euil » in « feuille ».","why":"One word for he, she and it. Spoken only; the written form is 他/她.","wt":["佢"],"zh":"佢","jp":"keoi5","et":["佢","係","我","女朋友","。"],"ezh":"佢係我女朋友。","ejp":"keoi5 hai6 ngo5 neoi5 pang4 jau5.","anki":true,"notes":"<b>Gloss:<\/b> 佢 — keoi5 — il · 係 — hai6 — être · 我 — ngo5 — je · 女朋友 — neoi5 pang4 jau5 — petite amie<br><b>Pronunciation:<\/b> keoi5: « eoi » ≈ French « euil » in « feuille ».<br><b>Usage:<\/b> One word for he, she and it. Spoken only; the written form is 他/她.","nw":56},{"w":"我哋","en":"we, us","fr":"nous","ex":"我哋 去 飲茶 啦 ！","ex_en":"Let's go for dim sum!","ex_fr":"Allons manger des dim sum !","gram":"哋 makes any pronoun plural.","mn":"« dei » ≈ « they » glued to « I » → us.","wt":["我哋"],"zh":"我哋","jp":"ngo5 dei6","et":["我哋","去","飲茶","啦","！"],"ezh":"我哋去飲茶啦！","ejp":"ngo5 dei6 heoi3 jam2 caa4 laa1!","anki":true,"notes":"<b>Gloss:<\/b> 我哋 — ngo5 dei6 — nous · 去 — heoi3 — aller · 飲茶 — jam2 caa4 — manger des dim sum · 啦 — laa1 — (particule : allez !)<br><b>Grammar:<\/b> 哋 makes any pronoun plural.","nw":38},{"w":"係","en":"to be; yes","fr":"être ; oui","ex":"佢 係 香港人 。","ex_en":"She's from Hong Kong.","ex_fr":"Elle est hongkongaise.","why":"Links two nouns (A = B). Never use it before adjectives: 我好攰 « I'm very tired », not 我係攰.","gram":"係呀！ = « yes! ». 唔係 = « no / it's not ».","mn":"hai6 ≈ « hi », low and flat: « Hi, I *am*… ».","wt":["係"],"zh":"係","jp":"hai6","et":["佢","係","香港人","。"],"ezh":"佢係香港人。","ejp":"keoi5 hai6 hoeng1 gong2 jan4.","anki":true,"notes":"<b>Gloss:<\/b> 佢 — keoi5 — il · 係 — hai6 — être · 香港人 — hoeng1 gong2 jan4 — Hongkongais(e)<br><b>Grammar:<\/b> 係呀！ = « yes! ». 唔係 = « no / it's not ».<br><b>Usage:<\/b> Links two nouns (A = B). Never use it before adjectives: 我好攰 « I'm very tired », not 我係攰.","nw":54},{"w":"唔","en":"not","fr":"ne… pas","ex":"我 唔 明 。","ex_en":"I don't understand.","ex_fr":"Je ne comprends pas.","mn":"唔 = 口 (mouth) + 吾: a mouth going « mm-mm » (no).","tip":"Just a low hummed « m », lips closed.","wt":["唔"],"zh":"唔","jp":"m4","et":["我","唔","明","。"],"ezh":"我唔明。","ejp":"ngo5 m4 ming4.","anki":true,"notes":"<b>Gloss:<\/b> 我 — ngo5 — je · 唔 — m4 — ne… pas · 明 — ming4 — comprendre<br><b>Pronunciation:<\/b> Just a low hummed « m », lips closed.","nw":29},{"w":"有","en":"to have; there is","fr":"avoir ; il y a","ex":"你 有 冇 八達通 呀 ？","ex_en":"Do you have an Octopus card?","ex_fr":"Tu as une carte Octopus ?","gram":"有冇 + noun? = « do you have…? ». Answer 有 or 冇.","mn":"jau5 ≈ « yo! »: « Yo, I have it! »","wt":["有"],"zh":"有","jp":"jau5","et":["你","有","冇","八達通","呀","？"],"ezh":"你有冇八達通呀？","ejp":"nei5 jau5 mou5 baat3 daat6 tung1 aa3?","anki":true,"notes":"<b>Gloss:<\/b> 你 — nei5 — tu · 有 — jau5 — avoir · 冇 — mou5 — ne pas avoir · 八達通 — baat3 daat6 tung1 — carte Octopus · 呀 — aa3 — (particule adoucissante)<br><b>Grammar:<\/b> 有冇 + noun? = « do you have…? ». Answer 有 or 冇.","nw":5  (far).","wt":["呢個"],"zh":"呢個","jp":"ni1 go3","et":["我","要","呢個","。"],"ezh":"我要呢個。","ejp":"ngo5 jiu3 ni1 go3.","anki":true,"notes":"<b>Gloss:<\/b> 我 — ngo5 — je · 要 — jiu3 — vouloir · 呢個 — ni1 go3 — celui-ci<br><b>Grammar:<\/b> 呢 ni1 = this, 嗰 go2 = that. Then a measure word: 呢個, 嗰個.","nw":34}],"extra":null},{"id":"questions","title":"Asking questions","zh":"問嘢","blurb":"Question words and the « go-not-go? » trick","intro":["Question words **stay in place**, no inversion: 你去邊度？ = « you go where? », like spoken French « tu vas où ? ».","Yes/no questions: **verb + 唔 + verb**: 去唔去？ « go-not-go? ». For « have »: 有冇.","There is **no single word for yes**. Repeat the verb: 去！ / 唔去。","Add **呀 aa3** at the end to sound friendlier."],"items":[{"w":"乜嘢","en":"what?","fr":"quoi ?","ex":"呢個 係 乜嘢 呀 ？","ex_en":"What is this?","ex_fr":"C'est quoi, ça ?","lit":"what thing","why":"Short, casual version: 咩 me1.","mn":"« Mat-yeah? »: what's the matter, yeah?","wt":["乜嘢"],"zh":"乜嘢","jp":"mat1 je5","et":["呢個","係","乜嘢","呀","？"],"ezh":"呢個係乜嘢呀？","ejp":"ni1 go3 hai6 mat1 je5 aa3?","anki":true,"notes":"<b>Gloss:<\/b> 呢個 — ni1 go3 — celui-ci · 係 — hai6 — être · 乜嘢 — mat1 je5 — quoi ? · 呀 — aa3 — (particule adoucissante)<br><b>Literally:<\/b> what thing<br><b>Usage:<\/b> Short, casual version: 咩 me1.","nw":37},{"w":"邊度","en":"where?","fr":"où ?","ex":"港鐵 站 喺 邊度 呀 ？","ex_en":"Where is the MTR station?","ex_fr":"Où est la station de métro ?","lit":"which place","gram":"Place + 喺邊度？ = « where is…? ».","mn":"« Been, doe? » Where have you been, deer?","wt":["邊度"],"zh":"邊度","jp":"bin1 dou6","et":["港鐵","站","喺","邊度","呀","？"],"ezh":"港鐵站喺邊度呀？","ejp":"gong2 tit3 zaam6 hai2 bin1 dou6 aa3?","anki":true,"notes":"<b>Gloss:<\/b> 港鐵 — gong2 tit3 — métro de HK · 站 — zaam6 — station · 喺 — hai2 — être à · 邊度 — bin1 dou6 — où ? · 呀 — aa3 — (particule adoucissante)<br><b>Literally:<\/b> which place<br><b>Grammar:<\/b> Place + 喺邊度？ = « where is…? ».","nw":49},{"w":"邊個","en":"who? which one?","fr":"qui ? lequel ?","e u2 aa3! dang2 zan6 gin3!","en":"OK! See you soon!","fr":"D'accord ! À tout à l'heure !"}]},{"id":"rain","title":"A rainy day","zh":"落雨天","level":1,"note":"緊 = -ing: 飲緊 = drinking right now. 喇 after 唔出街 = « so, we're not going out after all ».","lines":[{"sp":"","t":["今日","落雨","。"],"zh":"今日落雨。","jp":"gam1 jat6 lok6 jyu5.","en":"It's raining today.","fr":"Il pleut aujourd'hui."},{"sp":"","t":["好","凍","呀","！"],"zh":"好凍呀！","jp":"hou2 dung3 aa3!","en":"It's so cold!","fr":"Il fait trop froid !"},{"sp":"","t":["我哋","唔","出街","喇","。"],"zh":"我哋唔出街喇。","jp":"ngo5 dei6 m4 ceot1 gaai1 laa3.","en":"We're not going out, then.","fr":"Du coup, on ne sort pas."},{"sp":"","t":["我哋","喺","屋企","睇戲","。"],"zh":"我哋喺屋企睇戲。","jp":"ngo5 dei6 hai2 uk1 kei2 tai2 hei3.","en":"We're watching a movie at home.","fr":"On regarde un film à la maison."},{"sp":"","t":["佢","飲","緊","熱","奶茶","。"],"zh":"佢飲緊熱奶茶。","jp":"keoi5 jam2 gan2 jit6 naai5 caa4.","en":"She's drinking hot milk tea.","fr":"Elle boit un thé au lait chaud."},{"sp":"","t":["我","好","開心","。"],"zh":"我好開心。","jp":"ngo5 hou2 hoi1 sam1.","en":"I'm very happy.","fr":"Je suis très heureux."}]}],"groups":[["Start here",["tones","hello","family","blocks"]],["Grammar toolkit",["questions","particles","time","spoken","measure","adjectives","compare","linking","verbs"]],["Daily life",["numbers","food","days","routine","weather","home","shopping","phone","work"]],["People & feelings",["sweet","dinner","moods","reactions","elders","festivals"]],["Out & about",["around","plans","places","health"]]]}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const LEX = D.lex, SHEETS = D.sheets, READS = D.readings;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => String(s ?? '').replace(/\*\*(.+?)\*\*/g, '$1');
const disp = t => t.split('~')[0];
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>';
const HEAD = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 10V8a6 6 0 0 1 12 0v2" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="1.5" y="9" width="3.5" height="5.5" rx="1" fill="currentColor"/><rect x="11" y="9" width="3.5" height="5.5" rx="1" fill="currentColor"/></svg>';
const PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
const PREV = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="2.2" height="11" rx="1" fill="currentColor"/><path d="M14 2.5v11L5 8z" fill="currentColor"/></svg>';
const NEXT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="11.8" y="2.5" width="2.2" height="11" rx="1" fill="currentColor"/><path d="M2 2.5v11L11 8z" fill="currentColor"/></svg>';
const STOP = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" fill="currentColor"/></svg>';

/* ---------- storage (per-viewer convenience only) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('cco1:' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('cco1:' + k, JSON.stringify(v)); } catch(e){} }
};
const S = Object.assign({ rate: 0.8, voice: '', quiz: false, showJp: true, showEn: true, showFr: false, lsSrc: 'all', lsRepeat: 1, lsTrans: 'en', lsGap: 'normal', lsShuffle: false, lsLoop: false }, store.get('settings', {}));
let basket = store.get('basket', []);
const saveS = () => store.set('settings', S);
const saveB = () => { store.set('basket', basket); renderTabs(); };

/* ---------- jyutping rendering ---------- */
function jpHTML(jp){
  return String(jp).split(' ').map(s => {
    const m = s.match(/^([a-z]+)([1-6])(.*)$/);
    return m ? `<span class="t${m[2]}">${m[1]}<span class="tn">${m[2]}</span></span>${esc(m[3])}` : esc(s);
  }).join(' ');
}
const CONTOUR = {1:[5,5],2:[3,5],3:[3,3],4:[2,1],5:[2,3],6:[2,2]};
function contour(t, w = 26, h = 18){
  const [a, b] = CONTOUR[t]; const y = v => h - 2 - (v - 1) * (h - 4) / 4;
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M2 ${h-2}H${w-2}" stroke="currentColor" stroke-opacity=".25" fill="none"/><path d="M3 ${y(a)}L${w-3} ${y(b)}" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
}
const TONE_NAMES = {1:'high flat',2:'high rising',3:'mid flat',4:'low falling',5:'low rising',6:'low flat'};

/* ---------- speech ---------- */
const synth = window.speechSynthesis || null;
let hkVoices = [], allVoices = [], voice = null, enVoice = null, frVoice = null, warned = false, queue = null;
const isHK = v => /^(zh[-_]HK|yue)/i.test(v.lang) || /cantonese|hong kong|粵|廣東/i.test(v.name);
function loadVoices(){
  if (!synth) return;
  allVoices = synth.getVoices() || [];
  hkVoices = allVoices.filter(isHK);
  voice = hkVoices.find(v => v.voiceURI === S.voice) || hkVoices[0] || null;
  const en = allVoices.filter(v => /^en[-_]/i.test(v.lang)), fr = allVoices.filter(v => /^fr[-_]/i.test(v.lang));
  enVoice = en.find(v => /GB/i.test(v.lang) && v.localService) || en.find(v => /GB|US/i.test(v.lang)) || en[0] || null;
  frVoice = fr.find(v => /FR/i.test(v.lang) && v.localService) || fr[0] || null;
  if (state.view === 'voice') render();
  else { const b = $('#voiceBanner'); if (b) b.hidden = !!voice || !allVoices.length; }
}
function speak(text, onend, lang){
  lang = lang || 'zh-HK'; const zh = lang === 'zh-HK';
  if (!synth){ toast('Speech isn’t available in this browser'); return; }
  if (zh && !voice && allVoices.length && !warned){ warned = true; toast('No Cantonese voice found. Open the Voice tab.'); }
  const go = () => {
    const u = new SpeechSynthesisUtterance(String(text).replace(/~\w+/g, ''));
    u.lang = lang; const v = zh ? voice : (lang.startsWith('fr') ? frVoice : enVoice); if (v) u.voice = v;
    u.rate = zh ? S.rate : Math.max(S.rate, 0.9);
    if (onend){ u.onend = onend; u.onerror = onend; }
    synth.speak(u);
  };
  if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 80); } else go();
}
function stopAll(){ if (LS.playing) lsStop(); queue = null; if (synth) synth.cancel(); document.querySelectorAll('.line.now').forEach(e => e.classList.remove('now')); const b = $('#playAll'); if (b){ b.innerHTML = PLAY + ' Play all'; } }

/* ---------- cards (AI Lang YUE spec) ---------- */
function frGloss(f){ return f.startsWith('(') ? f.split(';')[0].trim() : f.split(';')[0].split(',')[0].trim(); }
function glossOf(tokens){ return tokens.filter(t => LEX[t]).map(t => `${LEX[t].z} — ${LEX[t].j} — ${frGloss(LEX[t].f)}`).join(' · '); }
function capNotes(parts){
  let n = parts.join('<br>');
  while (n.replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length > 150 && parts.length > 1){ parts.pop(); n = parts.join('<br>'); }
  return n;
}
function cardFromItem(it, sh){
  return { note_type: 'AI Lang YUE', deck: 'AI::Cantonese',
    fields: { Word: it.zh, Reading: it.jp, Sentence: it.ezh, SentenceReading: it.ejp, Meaning: it.fr,
      SentenceTranslation: it.ex_fr, Notes: it.notes }, tags: ['yue-' + sh.id], _en: it.en };
}
function cardFromToken(t, line, rd){
  const L = LEX[t]; const parts = [`<b>Gloss:</b> ${glossOf(line.t)}`];
  if (L.l) parts.push(`<b>Literally:</b> ${L.l}`);
  if (rd.note) parts.push(`<b>Grammar:</b> ${rd.note}`);
  return { note_type: 'AI Lang YUE', deck: 'AI::Cantonese',
    fields: { Word: L.z, Reading: L.j, Sentence: line.zh, SentenceReading: line.jp, Meaning: L.f,
      SentenceTranslation: line.fr, Notes: capNotes(parts) }, tags: ['yue-reading'], _en: L.e };
}
const inBasket = w => basket.some(c => c.fields.Word === w);
function toggleCard(card){
  const w = card.fields.Word;
  if (inBasket(w)){ basket = basket.filter(c => c.fields.Word !== w); toast(`Removed ${w} from your Anki list`); }
  else { basket.push(card); toast(`Added ${w} to your Anki list`); }
  saveB(); return inBasket(w);
}

/* ---------- state & routing ---------- */
const state = { view: 'sheets', id: null };
const hash = (location.hash || '').slice(1);
if (/^sheet-/.test(hash) && SHEETS.some(s => 'sheet-' + s.id === hash)) Object.assign(state, { view: 'sheet', id: hash.slice(6) });
else if (/^read-/.test(hash) && READS.some(r => 'read-' + r.id === hash)) Object.assign(state, { view: 'reading', id: hash.slice(5) });
else if (['read','listen','anki','voice'].includes(hash)) state.view = hash;
function go(view, id){ stopAll(); state.view = view; state.id = id || null; render(); window.scrollTo(0, 0); }

/* ---------- chrome ---------- */
function renderTop(){
  const t = $('#top');
  const sub = { sheet: ['sheets', 'All sheets'], reading: ['read', 'All readings'] }[state.view];
  if (sub){
    const title = state.view === 'sheet' ? SHEETS.find(s => s.id === state.id).title : READS.find(r => r.id === state.id).title;
    t.innerHTML = `<button class="back" data-go="${sub[0]}" aria-label="Back to ${esc(sub[1].toLowerCase())}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2 4 8l6 6" stroke="currentColor" stroke-width="2.5" fill="none"/></svg>Back</button><div class="top-title">${esc(title)}</div>`;
  } else {
    t.innerHTML = `<div class="brand"><b>Cantonese Carry-On</b><span lang="zh-HK">隨身廣東話</span></div>`;
  }
}
function renderTabs(){
  const cur = { sheets: 'sheets', sheet: 'sheets', read: 'read', reading: 'read', listen: 'listen', anki: 'anki', voice: 'voice' }[state.view];
  const tabs = [['sheets','學','Sheets'],['read','讀','Read'],['listen','聽','Listen'],['anki','卡','Anki'],['voice','聲','Voice']];
  $('#tabs').innerHTML = tabs.map(([v, zh, en]) => `<button class="tab" data-go="${v}" ${cur === v ? 'aria-current="page"' : ''}><i lang="zh-HK">${zh}</i><small>${en}</small>${v === 'anki' && basket.length ? `<span class="badge">${basket.length}</span>` : ''}</button>`).join('');
}
let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

const voiceBanner = () => `<div class="banner" id="voiceBanner" ${voice || !allVoices.length ? 'hidden' : ''}><span>No Cantonese voice on this device yet, so audio may sound wrong.</span><button class="chip warn" data-go="voice">Fix audio</button></div>`;

/* ---------- views ---------- */
function vSheets(){
  return `${voiceBanner()}
  <p class="eyebrow">Study sheets</p>
  <h1>Pick a topic<span class="zh" lang="zh-HK">揀一個題目</span></h1>
  <p class="lede">${SHEETS.length} sheets. Tap any Chinese text to hear it. Jyutping is coloured by tone:</p>
  <div class="legend">${[1,2,3,4,5,6].map(t => `<button class="t${t}" data-say="${['','詩','史','試','時','市','事'][t]}">${contour(t)}<span>${t} · ${TONE_NAMES[t]}</span></button>`).join('')}</div>
  ${D.groups.map(([g, ids]) => `<h2>${esc(g)}</h2><div class="tiles">${ids.map(id => SHEETS.find(s => s.id === id)).map(s => `<button class="tile" data-go="sheet:${s.id}"><span class="tile-zh" lang="zh-HK">${esc(s.zh)}</span><span class="tile-en">${esc(s.title)}</span><span class="tile-blurb">${esc(s.blurb)}</span><span class="tile-meta">${s.items.length} words & phrases</span></button>`).join('')}</div>`).join('')}`;
}
function factsHTML(it, sh){
  const rows = [];
  if (it.lit) rows.push(['Literally', esc(it.lit)]);
  if (it.why) rows.push(['Why', md(it.why)]);
  if (it.mn) rows.push(['Memory hook', md(it.mn)]);
  if (it.tip) rows.push(['Sound', md(it.tip)]);
  if (it.gram) rows.push(['Grammar', md(it.gram)]);
  if (it.mw) rows.push(['Measure word', `<span lang="zh-HK">${esc(it.mw)}</span>`]);
  if (it.written) rows.push(['Written / Mandarin', `<span lang="zh-HK">${esc(it.written)}</span>`]);
  return rows.length ? `<dl class="facts">${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` : '';
}
const veil = S => S ? 'veil' : '';
function itemHTML(it, sh, i){
  const q = S.quiz;
  let foot = '';
  if (it.anki) foot = `<button class="anki" data-card="${sh.id}:${i}" aria-pressed="${inBasket(it.zh)}">${inBasket(it.zh) ? '✓ In Anki list' : '+ Anki'}</button>`;
  else if (it.ref){ const r = SHEETS.find(s => s.id === it.ref); foot = `<span class="ref">Full card with example in <button class="linkbtn" data-go="sheet:${r.id}">${esc(r.title)}</button></span>`; }
  return `<article class="item">
    <div class="item-head"><button class="play" data-say="${esc(it.zh)}" aria-label="Play ${esc(it.zh)}">${PLAY}</button>
      <div><button class="say word" lang="zh-HK" data-say="${esc(it.zh)}">${esc(it.zh)}</button><div class="jp">${jpHTML(it.jp)}</div></div></div>
    <div class="mean ${veil(q)}" data-reveal><span class="en">${esc(it.en)}</span><span class="fr">${esc(it.fr)}</span></div>
    ${factsHTML(it, sh)}
    ${it.ezh ? `<div class="ex"><button class="play sm" data-say="${esc(it.ezh)}" aria-label="Play example">${PLAY}</button>
      <div class="ex-zh" lang="zh-HK" data-say="${esc(it.ezh)}">${esc(it.ezh)}</div><div class="ex-jp">${jpHTML(it.ejp)}</div>
      <div class="ex-en ${veil(q)}" data-reveal>${esc(it.ex_en)}</div><div class="ex-fr ${veil(q)}" data-reveal>${esc(it.ex_fr)}</div></div>` : ''}
    ${foot ? `<div class="item-foot">${foot}</div>` : ''}
  </article>`;
}
function extraHTML(sh){
  const x = sh.extra; if (!x) return '';
  if (x.kind === 'pron') return `<h2>Jyutping for a French speaker</h2><div class="tablewrap"><table><thead><tr><th>Letters</th><th>Sounds like</th><th>Example</th></tr></thead><tbody>${x.rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td><button class="linkbtn" lang="zh-HK" data-say="${esc(r[2].split(' ')[0])}">${esc(r[2])}</button></td></tr>`).join('')}</tbody></table></div>`;
  if (x.kind === 'numbers') return `<h2>1 to 10</h2><div class="nums">${x.rows.map(r => `<button class="num" data-say="${r[0]}"><b lang="zh-HK">${r[0]}</b><span>${jpHTML(r[1])}</span><small>${r[2]}</small></button>`).join('')}</div>
    <p class="numnotes">${x.rows.filter(r => r[3]).map(r => `<span lang="zh-HK">${r[0]}</span> ${esc(r[3])}`).join(' · ')}. Tap a number to hear it.</p>`;
  return '';
}
function vSheet(){
  const sh = SHEETS.find(s => s.id === state.id);
  const tones = sh.items.filter(i => i.tone), rest = sh.items.map((it, i) => [it, i]).filter(([it]) => !it.tone);
  const addable = sh.items.filter(i => i.anki);
  const allIn = addable.length && addable.every(i => inBasket(i.zh));
  return `${voiceBanner()}<p class="eyebrow">Study sheet</p><h1>${esc(sh.title)}<span class="zh" lang="zh-HK">${esc(sh.zh)}</span></h1>
  <p class="lede">${esc(sh.blurb)}</p>

const LS = { list: [], i: 0, playing: false, run: 0, wake: null, key: null, shuf: null, phase: '', rep: 0 };
const GAPS = { short: [400, 700, 1000], normal: [700, 1200, 1800], long: [1100, 2000, 3200] };
function lsItemsFor(key){
  const fromSheet = s => s.items.filter(i => i.ezh).map(i => ({ zh: i.ezh, jp: i.ejp, en: i.ex_en, fr: i.ex_fr, src: s.title }));

  if (key === 'all') return [...SHEETS.flatMap(fromSheet), ...READS.flatMap(fromRead)];
  const [k, id] = key.split(':');
  const s = k === 's' ? SHEETS.find(x => x.id === id) : READS.find(x => x.id === id);

function lsBuild(){
  let l = lsItemsFor(S.lsSrc);

function lsSay(text, lang, run, fn){
  let done = false; const fin = () => { if (done) return; done = true; clearTimeout(t); if (run === LS.run && LS.playing) fn(); };
  const est = (lang === 'zh-HK' ? 650 * text.length : 110 * text.length) / Math.min(S.rate, 1) + 3000;
  const t = setTimeout(fin, est);   // safety net if a browser never fires onend

function lsWait(ms, run, fn){ setTimeout(() => { if (run === LS.run && LS.playing) fn(); }, ms); }

  if (el.dataset.savejson){
    const b = batches()[+el.dataset.savejson];
    window.claude?.use?.('downloads').then(dl => dl ? dl.save({ filename: `cantonese-cards-${+el.dataset.savejson + 1}.json`, data: JSON.stringify(b.map(cleanCard), null, 2) }) : Promise.reject({ code: 'unavailable' }))
      .then(() => toast('Saved'), err => { if (err && err.code !== 'declined') toast('Saving isn’t available here. Use Copy instead.'); });
    return;
  }
  if (el.dataset.clear){
    if (el.dataset.armed){ const ws = new Set(batches()[+el.dataset.clear].map(c => c.fields.Word)); basket = basket.filter(c => !ws.has(c.fields.Word)); saveB(); render(); toast('Batch removed'); }
    else { el.dataset.armed = '1'; el.textContent = 'Tap again to remove'; el.classList.add('warn'); setTimeout(() => { if (el.isConnected){ delete el.dataset.armed; el.textContent = 'Remove batch'; el.classList.remove('warn'); } }, 3000); }
    return;
  }
  if (el.dataset.rm){ basket = basket.filter(c => c.fields.Word !== el.dataset.rm); saveB(); render(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'lsSrc'){ const was = LS.playing; if (was) lsStop(); S.lsSrc = e.target.value; saveS(); lsBuild(); render(); if (was) lsPlay(); return; } if (e.target.id === 'voiceSel'){ S.voice = e.target.value; saveS(); voice = hkVoices.find(v => v.voiceURI === S.voice) || voice; speak('你好'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pop').hidden) closePop(); });

render();
if (synth){ loadVoices(); if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(loadVoices, 2500); }
if (window.claude?.use) window.claude.use('downloads').then(d => { canSave = !!d; if (state.view === 'anki') render(); }).catch(() => {});
})();
</script>
